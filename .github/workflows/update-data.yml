name: Update data

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "21 20 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: Publish current sources or roll back pointers
        type: choice
        options: [publish, rollback]
        default: publish
      generation:
        description: Existing generation SHA required for rollback
        type: string
        required: false

permissions:
  actions: read
  contents: read

jobs:
  update:
    if: >-
      (github.event_name != 'workflow_run' &&
      (github.ref == 'refs/heads/master' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'))) ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master')
    concurrency:
      group: production-publish
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DIGITALOCEAN_APP_ID: 435103e7-5383-4f5e-804e-f8a1fb715c72
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          cache: npm

      - name: Verify tested checkout is current master
        id: head
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'rollback'
        run: |
          current="$(node scripts/check-publication-head.ts "$PUBLISH_SHA")"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Validate Hugging Face authentication
        if: steps.head.outputs.current == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node scripts/huggingface-source.ts auth

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          npm install --global npm@12.0.2
          npm ci

      - name: Roll back Server Index and Delivery pointer
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
        env:
          DATA_SPACES_ACCESS_KEY_ID: ${{ secrets.DATA_SPACES_ACCESS_KEY_ID }}
          DATA_SPACES_SECRET_ACCESS_KEY: ${{ secrets.DATA_SPACES_SECRET_ACCESS_KEY }}
          DATA_SPACES_BUCKET: ${{ vars.DATA_SPACES_BUCKET }}
          DATA_SPACES_CDN_BASE_URL: ${{ vars.DATA_SPACES_CDN_BASE_URL }}
          DATA_SPACES_ENDPOINT: ${{ vars.DATA_SPACES_ENDPOINT }}
          DATA_SPACES_REGION: ${{ vars.DATA_SPACES_REGION }}
          RANKINGS_REFRESH_SECRET: ${{ secrets.RANKINGS_REFRESH_SECRET }}
          SERVER_INDEX_ACTIVATION_URL: ${{ vars.SERVER_INDEX_ACTIVATION_URL }}
          ROLLBACK_GENERATION: ${{ inputs.generation }}
        run: node scripts/publish-delivery.ts rollback "$ROLLBACK_GENERATION"

      - name: Resolve immutable source revisions
        if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for source in catalog schedule ust-space sfq; do
            sha="$(node scripts/huggingface-source.ts revision "ust-archive/$source")"
            case "$source" in
              catalog) key=CATALOG_REVISION ;;
              schedule) key=SCHEDULE_REVISION ;;
              ust-space) key=REVIEWS_REVISION ;;
              sfq) key=SFQ_REVISION ;;
            esac
            echo "$key=$sha" >> "$GITHUB_ENV"
          done

      - name: Load previous Instructor identities
        if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          sha="$(node scripts/huggingface-source.ts revision ust-archive/ust-rankings)"
          echo "RANKINGS_IDENTITY_COMMIT=$sha" >> "$GITHUB_ENV"
          uvx hf download ust-archive/ust-rankings --type dataset --revision "$sha" --local-dir "$RUNNER_TEMP/previous-rankings" --include course-instructors.parquet --include instructor-identities.parquet --include instructor-aliases.parquet --include instructor-identity-events.parquet --include instructor-split-affected-associations.parquet
          test -f "$RUNNER_TEMP/previous-rankings/instructor-identities.parquet"
          echo "RANKINGS_PREVIOUS_GENERATION_DIR=$RUNNER_TEMP/previous-rankings" >> "$GITHUB_ENV"

      - name: Build full-fidelity Ranking archive
        if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true'
        working-directory: data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          npm run type-check
          RANKINGS_PREVIOUS_GENERATION_DIR= npm test
          RANKINGS_INSTRUCTOR_REGISTRY_FILE=instructor-identity-corrections.json npm run run
          cp dataset/README.md out/README.md

      - name: Publish full-fidelity Ranking archive
        if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          current="$(node scripts/check-publication-head.ts "$PUBLISH_SHA")"
          if [ "$current" != true ]; then
            echo "PUBLICATION_STALE=true" >> "$GITHUB_ENV"
            echo "Current master changed; skipping remaining publication writers."
            exit 0
          fi
          uvx hf repos create ust-archive/ust-rankings --type dataset --exist-ok
          uvx hf upload ust-archive/ust-rankings data/out . --type dataset --commit-message "update(v0): $(TZ='Asia/Hong_Kong' date --iso-8601=seconds)"
          sha="$(node scripts/huggingface-source.ts revision ust-archive/ust-rankings)"
          echo "RANKING_GENERATION_SHA=$sha" >> "$GITHUB_ENV"

      - name: Download pinned canonical archives
        if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx hf download ust-archive/ust-rankings --type dataset --revision "$RANKING_GENERATION_SHA" --local-dir "$RUNNER_TEMP/rankings" --include courses.parquet --include course-ratings.parquet --include instructor-ratings.parquet --include course-instructors.parquet --include instructor-identities.parquet --include instructor-aliases.parquet --include instructor-identity-events.parquet --include instructor-split-affected-associations.parquet
          schedule_tree="$(curl --fail --silent --show-error --header "Authorization: Bearer $HF_TOKEN" "https://huggingface.co/api/datasets/ust-archive/schedule/tree/$SCHEDULE_REVISION?recursive=true")"
          uvx hf download ust-archive/schedule --type dataset --revision "$SCHEDULE_REVISION" --local-dir "$RUNNER_TEMP/schedule" --include courses.parquet --include classes.parquet
          schedule_files=(courses.parquet classes.parquet)
          if jq -e '.[] | select(.type == "file" and .path == "canonical/class_records.parquet")' <<<"$schedule_tree" >/dev/null; then
            uvx hf download ust-archive/schedule --type dataset --revision "$SCHEDULE_REVISION" --local-dir "$RUNNER_TEMP/schedule" --include canonical/class_records.parquet
            schedule_files+=(canonical/class_records.parquet)
          elif jq -e '.[] | select(.type == "file" and .path == "classes_legacy.parquet")' <<<"$schedule_tree" >/dev/null; then
            uvx hf download ust-archive/schedule --type dataset --revision "$SCHEDULE_REVISION" --local-dir "$RUNNER_TEMP/schedule" --include classes_legacy.parquet
            schedule_files+=(classes_legacy.parquet)
          else
            echo "::warning::Schedule archive has no canonical/class_records.parquet or classes_legacy.parquet; Waitlist Evidence will be unavailable."
          fi
          node scripts/write-source-manifest.ts "$RUNNER_TEMP/rankings" "$RANKING_GENERATION_SHA" courses.parquet course-ratings.parquet instructor-ratings.parquet course-instructors.parquet instructor-identities.parquet instructor-aliases.parquet instructor-identity-events.parquet instructor-split-affected-associations.parquet
          node scripts/write-source-manifest.ts "$RUNNER_TEMP/schedule" "$SCHEDULE_REVISION" "${schedule_files[@]}"

      - name: Build paired Delivery Dataset and Server Index
        if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true'
        run: |
          npm run build-delivery --workspace data -- --ranking-dir "$RUNNER_TEMP/rankings" --schedule-dir "$RUNNER_TEMP/schedule" --ranking-revision "$RANKING_GENERATION_SHA" --schedule-revision "$SCHEDULE_REVISION" --output-dir "$RUNNER_TEMP/delivery"
          generation="$(find "$RUNNER_TEMP/delivery" -mindepth 1 -maxdepth 1 -type d -printf '%f\n')"
          [[ "$generation" =~ ^[0-9a-f]{64}$ ]]
          echo "DELIVERY_GENERATION=$generation" >> "$GITHUB_ENV"
          echo "DELIVERY_DIRECTORY=$RUNNER_TEMP/delivery/$generation" >> "$GITHUB_ENV"

      - if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true' && github.event_name == 'workflow_run'
        name: Download image digest from CI
        uses: actions/download-artifact@v7
        with:
          name: production-image-digest
          path: .deploy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true' && github.event_name == 'workflow_run'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Create image app spec
        if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true' && github.event_name == 'workflow_run'
        run: |
          mkdir -p .do
          digest="$(tr -d '\r\n' < .deploy/image-digest.txt)"
          doctl apps get "$DIGITALOCEAN_APP_ID" --output json > .deploy/app.json
          node scripts/create-image-app-spec.ts .deploy/app.json "$digest" .do/app.json

      - name: Deploy verified image to DigitalOcean App Platform
        if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true' && github.event_name == 'workflow_run'
        run: |
          current="$(node scripts/check-publication-head.ts "$PUBLISH_SHA")"
          if [ "$current" != true ]; then
            echo "PUBLICATION_STALE=true" >> "$GITHUB_ENV"
            echo "Current master changed; skipping remaining publication writers."
            exit 0
          fi
          if doctl apps update "$DIGITALOCEAN_APP_ID" --spec .do/app.json --wait --output json > .deploy/updated-app.json; then
            exit 0
          fi
          # doctl outputs the original update response when its deployment wait fails.
          if ! deployment_id="$(jq -er '.[0].pending_deployment.id // .[0].in_progress_deployment.id' .deploy/updated-app.json)"; then
            echo "::error::App update failed without identifying a deployment."
            exit 1
          fi
          digest="$(tr -d '\r\n' < .deploy/image-digest.txt)"
          if doctl apps get-deployment "$DIGITALOCEAN_APP_ID" "$deployment_id" --output json > .deploy/deployment.json; then
            jq '.[0] | {id, phase, progress}' .deploy/deployment.json
            if jq -e --arg digest "$digest" \
              '.[0] | .phase == "ACTIVE" and any(.spec.services[]; .name == "web" and .image.digest == $digest)' \
              .deploy/deployment.json > /dev/null; then
              echo "Deployment became active after doctl wait exited unexpectedly."
              exit 0
            fi
          fi
          doctl apps logs "$DIGITALOCEAN_APP_ID" web --deployment "$deployment_id" --type deploy --tail 100 || true
          exit 1

      - name: Publish derived generation canonically to Hugging Face
        if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          current="$(node scripts/check-publication-head.ts "$PUBLISH_SHA")"
          if [ "$current" != true ]; then
            echo "PUBLICATION_STALE=true" >> "$GITHUB_ENV"
            echo "Current master changed; skipping remaining publication writers."
            exit 0
          fi
          uvx hf upload ust-archive/ust-rankings "$DELIVERY_DIRECTORY" "browser/$DELIVERY_GENERATION" --type dataset --commit-message "publish browser generation $DELIVERY_GENERATION"

      - name: Mirror, activate, and promote Delivery generation
        if: steps.head.outputs.current == 'true' && env.PUBLICATION_STALE != 'true'
        env:
          DATA_SPACES_ACCESS_KEY_ID: ${{ secrets.DATA_SPACES_ACCESS_KEY_ID }}
          DATA_SPACES_SECRET_ACCESS_KEY: ${{ secrets.DATA_SPACES_SECRET_ACCESS_KEY }}
          DATA_SPACES_BUCKET: ${{ vars.DATA_SPACES_BUCKET }}
          DATA_SPACES_CDN_BASE_URL: ${{ vars.DATA_SPACES_CDN_BASE_URL }}
          DATA_SPACES_ENDPOINT: ${{ vars.DATA_SPACES_ENDPOINT }}
          DATA_SPACES_REGION: ${{ vars.DATA_SPACES_REGION }}
          RANKINGS_REFRESH_SECRET: ${{ secrets.RANKINGS_REFRESH_SECRET }}
          SERVER_INDEX_ACTIVATION_URL: ${{ vars.SERVER_INDEX_ACTIVATION_URL }}
        run: node scripts/publish-delivery.ts publish "$DELIVERY_DIRECTORY"
