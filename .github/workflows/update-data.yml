name: Update data

on:
  push:
    branches: [master]
  schedule:
    # 04:21 HKT daily.
    - cron: "21 20 * * *"
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          cache: npm

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          npm install --global npm@12.0.2
          npm ci

      - name: Load previous Instructor identities
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          sha="$(curl --fail --silent --show-error \
            https://huggingface.co/api/datasets/ust-archive/ust-rankings/revision/main \
            | jq -r .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "RANKINGS_IDENTITY_COMMIT=$sha" >> "$GITHUB_ENV"
          uvx hf download ust-archive/ust-rankings \
            --type dataset \
            --revision "$sha" \
            --local-dir "$RUNNER_TEMP/previous-rankings"
          test -f "$RUNNER_TEMP/previous-rankings/instructor-identities.parquet"
          echo "RANKINGS_PREVIOUS_GENERATION_DIR=$RUNNER_TEMP/previous-rankings" >> "$GITHUB_ENV"

      - name: Build data
        working-directory: data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          npm run type-check
          RANKINGS_PREVIOUS_GENERATION_DIR= npm test
          npm run run
          cp dataset/README.md out/README.md

      - name: Create dataset if missing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx hf repos create ust-archive/ust-rankings \
            --type dataset \
            --exist-ok

      - name: Upload data
        working-directory: data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx hf upload ust-archive/ust-rankings out . \
            --type dataset \
            --delete "*.parquet" \
            --commit-message "update(v0): $(TZ='Asia/Hong_Kong' date --iso-8601=seconds)"

      - name: Trigger commit-pinned runtime refresh
        env:
          RANKINGS_REFRESH_URL: ${{ secrets.RANKINGS_REFRESH_URL }}
          RANKINGS_REFRESH_SECRET: ${{ secrets.RANKINGS_REFRESH_SECRET }}
        run: |
          if [[ -z "$RANKINGS_REFRESH_URL" || -z "$RANKINGS_REFRESH_SECRET" ]]; then
            echo "Runtime refresh secrets are not configured; the daily fallback remains active."
            exit 0
          fi
          sha="$(curl --fail --silent --show-error \
            https://huggingface.co/api/datasets/ust-archive/ust-rankings/revision/main \
            | jq -r .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RANKINGS_REFRESH_SECRET" \
            --header "Content-Type: application/json" \
            --data "{\"sha\":\"$sha\"}" \
            "${RANKINGS_REFRESH_URL%/}/api/rankings/refresh"
