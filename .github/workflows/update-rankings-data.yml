name: Update rankings data

on:
  schedule:
    # 04:21 HKT daily.
    - cron: "21 20 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build rankings data
        working-directory: data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bun run type-check
          bun run test
          bun run run
          cp dataset/README.md out/README.md

      - name: Create dataset if missing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx hf repos create ust-archive/ust-rankings \
            --type dataset \
            --exist-ok

      - name: Upload rankings data
        working-directory: data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx hf upload ust-archive/ust-rankings out . \
            --type dataset \
            --delete "*.parquet" \
            --commit-message "update(v0): $(TZ='Asia/Hong_Kong' date --iso-8601=seconds)"
