name: Update rankings data

on:
  schedule:
    # 04:21 HKT daily.
    - cron: "21 20 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Load previous Instructor identities
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          sha="$(curl --fail --silent --show-error \
            https://huggingface.co/api/datasets/ust-archive/ust-rankings/revision/main \
            | jq -r .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if curl --fail --silent --show-error \
            "https://huggingface.co/api/datasets/ust-archive/ust-rankings/tree/$sha?recursive=true" \
            | jq -e 'any(.[]; .path == "instructor-identities.parquet")' >/dev/null; then
            uvx hf download ust-archive/ust-rankings \
              --type dataset \
              --revision "$sha" \
              --local-dir "$RUNNER_TEMP/previous-rankings"
            echo "RANKINGS_PREVIOUS_GENERATION_DIR=$RUNNER_TEMP/previous-rankings" >> "$GITHUB_ENV"
          else
            [[ "$sha" == "0699cb351bcd01cd2efc0cbf5c4ff479d2ff558d" ]]
            echo "RANKINGS_IDENTITY_BOOTSTRAP=$GITHUB_WORKSPACE/rankings/seed/$sha/manifest.json" >> "$GITHUB_ENV"
          fi

      - name: Build rankings data
        working-directory: data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bun run type-check
          bun run test
          bun run run
          cp dataset/README.md out/README.md

      - name: Create dataset if missing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx hf repos create ust-archive/ust-rankings \
            --type dataset \
            --exist-ok

      - name: Upload rankings data
        working-directory: data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx hf upload ust-archive/ust-rankings out . \
            --type dataset \
            --delete "*.parquet" \
            --commit-message "update(v0): $(TZ='Asia/Hong_Kong' date --iso-8601=seconds)"

      - name: Trigger commit-pinned runtime refresh
        env:
          RANKINGS_REFRESH_URL: ${{ secrets.RANKINGS_REFRESH_URL }}
          RANKINGS_REFRESH_SECRET: ${{ secrets.RANKINGS_REFRESH_SECRET }}
        run: |
          if [[ -z "$RANKINGS_REFRESH_URL" || -z "$RANKINGS_REFRESH_SECRET" ]]; then
            echo "Runtime refresh secrets are not configured; the daily fallback remains active."
            exit 0
          fi
          sha="$(curl --fail --silent --show-error \
            https://huggingface.co/api/datasets/ust-archive/ust-rankings/revision/main \
            | jq -r .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RANKINGS_REFRESH_SECRET" \
            --header "Content-Type: application/json" \
            --data "{\"sha\":\"$sha\"}" \
            "${RANKINGS_REFRESH_URL%/}/api/rankings/refresh"
