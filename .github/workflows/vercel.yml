# Deploy to Vercel from GitHub Actions because the project is under an organization.
# Vercel cannot link an organization project on the Hobby plan.

name: Deploy Vercel
on:
  schedule:
    # At 20:00 UTC (04:00 HKT)
    - cron: "0 20 * * *"
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run check

      - run: |
          npx --yes vercel@59.3.0 pull --yes --token=${VERCEL_TOKEN} --environment=production
          npx --yes vercel@59.3.0 build --prod --token=${VERCEL_TOKEN}
          npx --yes vercel@59.3.0 deploy --prod --prebuilt --token=${VERCEL_TOKEN}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
