# Deploy to Vercel from GitHub Actions because the project is under an organization.
# Vercel cannot link an organization project on the Hobby plan.

name: Deploy Vercel
on:
  schedule:
    # At 20:00 UTC (04:00 HKT)
    - cron: "0 20 * * *"
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run check

      - run: |
          bunx --bun vercel pull --yes --token=${VERCEL_TOKEN} --environment=production
          bunx --bun vercel build --prod --token=${VERCEL_TOKEN}
          bunx --bun vercel deploy --prod --prebuilt --token=${VERCEL_TOKEN}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
