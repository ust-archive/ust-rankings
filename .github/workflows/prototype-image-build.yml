name: Prototype image build benchmark

on:
  push:
    branches: [prototype/build-benchmark]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ust-archive/ust-rankings-build-benchmark:${{ github.sha }}
          cache-from: type=gha,scope=prototype-image
          cache-to: type=gha,mode=max,scope=prototype-image
      - name: Make benchmark image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method PATCH
          /orgs/ust-archive/packages/container/ust-rankings-build-benchmark/visibility
          -f visibility=public
