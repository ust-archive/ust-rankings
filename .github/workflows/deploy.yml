name: Deploy

on:
  workflow_run:
    workflows: [Update data]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIGITALOCEAN_APP_ID: 435103e7-5383-4f5e-804e-f8a1fb715c72
    steps:
      - name: Check this is still the latest commit
        id: latest
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/master | cut -f1)"
          if [ "$latest_sha" = "$TESTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is awaiting CI; leaving deployment to that run."
          fi

      - if: steps.latest.outputs.deploy == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - if: steps.latest.outputs.deploy == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0

      - if: steps.latest.outputs.deploy == 'true'
        name: Download image digest from the successful CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ci_run_id="$(gh run list --workflow CI --commit "$TESTED_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$ci_run_id"
          gh run download "$ci_run_id" --name production-image-digest --dir .deploy

      - if: steps.latest.outputs.deploy == 'true'
        name: Download published Ranking Generation SHA
        uses: actions/download-artifact@v4
        with:
          name: ranking-generation-sha
          path: .deploy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - if: steps.latest.outputs.deploy == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Create image app spec
        if: steps.latest.outputs.deploy == 'true'
        run: |
          mkdir -p .do
          digest="$(tr -d '\r\n' < .deploy/image-digest.txt)"
          doctl apps get "$DIGITALOCEAN_APP_ID" --output json > .deploy/app.json
          node scripts/create-image-app-spec.ts .deploy/app.json "$digest" .do/app.json

      - name: Deploy verified image to DigitalOcean App Platform
        if: steps.latest.outputs.deploy == 'true'
        run: |
          if doctl apps update "$DIGITALOCEAN_APP_ID" --spec .do/app.json --wait; then
            exit 0
          fi
          deployment_id="$(doctl apps list-deployments "$DIGITALOCEAN_APP_ID" --format ID --no-header | head -1)"
          doctl apps logs "$DIGITALOCEAN_APP_ID" web --deployment "$deployment_id" --type deploy --tail 100 || true
          exit 1

      - name: Activate published Ranking Generation
        if: steps.latest.outputs.deploy == 'true'
        env:
          RANKINGS_REFRESH_URL: ${{ secrets.RANKINGS_REFRESH_URL }}
          RANKINGS_REFRESH_SECRET: ${{ secrets.RANKINGS_REFRESH_SECRET }}
        run: |
          if [[ -z "$RANKINGS_REFRESH_URL" || -z "$RANKINGS_REFRESH_SECRET" ]]; then
            echo "Runtime refresh secrets are not configured; the daily fallback remains active."
            exit 0
          fi
          node scripts/refresh-rankings-runtime.ts "$(<.deploy/ranking-generation-sha.txt)"
