name: Update rankings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          ref: data
          path: data

      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          ref: next
          path: action

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build ratings from Hugging Face
        working-directory: action
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bun ci
          bun run type-check
          bun run test
          bun run run

      - name: Commit changed outputs
        working-directory: data
        run: |
          outputs=(
            course-ratings.parquet
            instructor-ratings.parquet
            course-rankings.parquet
            instructor-rankings.parquet
            course-instructors.parquet
          )

          for output in "${outputs[@]}"; do
            test -f "../action/out/$output"
            cp "../action/out/$output" "$output"
          done

          git config --local user.email "bot@ust-rankings.com"
          git config --local user.name "UST Rankings Bot"
          git add -- "${outputs[@]}"
          git rm --ignore-unmatch -- \
            ratings-course.json \
            ratings-instructor.json \
            data-quality.parquet \
            data-quality.json \
            teaching-assignments.parquet
          git diff --cached --quiet || git commit -m "update: $(TZ=Asia/Hong_Kong date +'%Y-%m-%d')"
          git push origin HEAD:data
